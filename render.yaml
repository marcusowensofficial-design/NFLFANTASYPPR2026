services:
  - type: web
    name: apex-fantasy-analytics
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: ESPN_LEAGUE_ID
        sync: false
      - key: ESPN_SEASON
        value: "2026"
      - key: ESPN_SWID
        sync: false
      - key: ESPN_S2
        sync: false
      - key: DATABASE_URL
        value: "sqlite:///./data/fantasy.db"
